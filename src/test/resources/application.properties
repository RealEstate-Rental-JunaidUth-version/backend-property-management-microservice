# application-test.properties for property-microservice
spring.cloud.config.enabled=false
spring.profiles.active=dev
spring.application.name=property-microservice

# Local Datasource (H2)
spring.datasource.url=${DEV_DB_PROPERTY_URL:jdbc:h2:mem:propertydb}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Multipart file configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

# Security Settings
application.security.jwt.secret-key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

# Web3j / Blockchain
contract.rental.address=0x5FbDB2315678afecb367f032d93F642f64180aa3
wallet.private-key=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80

# Supabase (for image storage)
supabase.dbpassword=dev_db_password_123
supabase.url=https://wzqnlcmmqqfqisqrshkp.supabase.co
supabase.anon-key=your_dev_supabase_anon_key
supabase.service_key=your_dev_supabase_service_role_key
supabase.storage.bucket-name=property-images-bucket

# External Services
microservice.recommendation-ai.url=${RECOMENDATION_IA_URL:http://localhost:8001}
heatmap.service.url=${HEATMAP_SERVICE_URL:http://localhost:8002}
ml-price-suggestion.service.url=${ML_PRICE_SUGGESTION_URL:http://localhost:8003}
userManagement.service.url=${USER_MANAGEMENT_SERVICE_URL:http://localhost:8081}

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env
management.endpoint.health.show-details=always
